<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>游泳口令整理器</title><style>body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#17343b;background:#eef6f6}header{background:#176b75;color:white;padding:14px}h1{margin:0;font-size:24px}.wrap{display:grid;grid-template-columns:420px 1fr;gap:12px;padding:12px}section{background:white;border:1px solid #d7e4e7;border-radius:8px;overflow:hidden;margin-bottom:12px}.title{font-weight:800;background:#f7fbfb;border-bottom:1px solid #d7e4e7;padding:10px}.body{padding:10px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #d7e4e7;border-radius:7px;padding:9px}textarea{min-height:180px;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}button{border:0;border-radius:7px;padding:10px;font-weight:800;background:#176b75;color:white}.secondary{background:#e6eef0;color:#17343b}.danger{background:#ad3028}.warn{background:#f2c94c;color:#382900}.status{margin-top:8px;padding:9px;border-radius:7px;background:#eef6f6;color:#647780}.ok{background:#e8f6ef;color:#137a4f}.bad{background:#fff0ee;color:#b42318}.table{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;background:white}th,td{border-bottom:1px solid #d7e4e7;padding:8px;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#dff0f1}.res{font-weight:900;color:#176b75}.rank{display:inline-block;background:#f2c94c;color:#3b2a00;border-radius:999px;padding:1px 6px;margin-left:4px}.link{background:transparent;color:#176b75;text-decoration:underline;padding:0}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal-bg.show{display:flex}.modal{background:white;border-radius:8px;width:min(420px,100%);overflow:hidden}.modal h2{margin:0;background:#176b75;color:white;padding:12px}.modal .line{display:flex;justify-content:space-between;border-bottom:1px solid #d7e4e7;padding:9px 0}.modal strong{color:#176b75;font-size:18px}@media(max-width:900px){.wrap{display:block;padding:8px}section{border-left:0;border-right:0;border-radius:0}textarea{min-height:32vh;font-size:17px}.row{position:sticky;bottom:0;background:white;padding-top:8px}button{min-height:45px}th,td{font-size:14px}}</style></head><body><header><h1>游泳口令整理器</h1><div>修正版：出發/回來正確配對，點成績看明細</div></header><div class="wrap"><div><section><div class="title">口令文字</div><div class="body"><textarea id="cmd" placeholder="例：盧昱妡000出發盧冠羽005出發趙祤絜010出發，盧昱妡235回來盧冠羽125回來趙祤絜145回來"></textarea><div class="row"><button id="parse" class="warn">整理</button><button id="clear" class="secondary">清空文字</button><button id="demo">放入範例</button><button id="reset" class="danger">清空結果</button><button id="copy" class="secondary">複製表格</button><button id="csv" class="secondary">匯出 CSV</button></div><div id="status" class="status">可輸入：000出發、235回來、150扣5秒。只有扣秒模式可沒有出發時間直接算成績。</div></div></section><section><div class="title">常用學生名單</div><div class="body"><textarea id="roster">林育丞
方芮婕
盧冠羽
黃敬芫
朱信毅
黃柏豪
朱畇嬨
黃敬倫
陳唯恩
趙祤絜
魏劭倫
魏彤恩
陳曉寬
盧昱妡
陳奕飛
方玥棠</textarea></div></section><section><div class="title">姓名校正</div><div class="body"><textarea id="corr">育成=育丞
育承=育丞
玉成=育丞
育辰=育丞
方芮傑=方芮婕
方瑞傑=方芮婕
方瑞婕=方芮婕
冠宇=冠羽
冠瑜=冠羽
敬元=敬芫
敬原=敬芫
信義=信毅
柏皓=柏豪
芸慈=畇嬨
云慈=畇嬨
祐潔=祤絜
祐絜=祤絜
劭綸=劭倫
昱欣=昱妡
奕霏=奕飛
月棠=玥棠</textarea></div></section></div><div><section><div class="title">整理表</div><div class="table"><table id="summary"></table></div></section><section><div class="title">原始紀錄與提醒</div><div class="table" style="max-height:300px"><table id="raw"></table></div></section></div></div><div id="mbg" class="modal-bg"><div class="modal"><h2 id="mt">趟次明細</h2><div class="body" id="mc"></div><div class="body"><button class="secondary" style="width:100%" id="mclose">關閉</button></div></div></div><script>const maxTrips=6,state={entries:[],issues:[]};const $=id=>document.getElementById(id);function setStatus(t,c=''){const s=$('status');s.textContent=t;s.className='status '+c}function corr(){return $('corr').value.split(/\n+/).map(x=>x.trim()).filter(x=>x.includes('=')).map(x=>{let[a,b]=x.split('=').map(y=>y.trim());return a&&b?{a,b}:null}).filter(Boolean)}function applyCorr(t){for(const{x,a,b}of corr().map(o=>({a:o.a,b:o.b})))t=t.replaceAll(a,b);return t}function roster(){return $('roster').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).sort((a,b)=>b.length-a.length)}function norm(t){return applyCorr(t).replace(/[，、。；;｜|]/g,',').replace(/\s+/g,'').replace(/兩/g,'二').replace(/[零〇]/g,'0')}function cn(s){if(s==null||s==='')return 0;s=String(s).replace(/[零〇]/g,'');if(/^\d+$/.test(s))return +s;const d={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};if(s==='十')return 10;if(s.includes('十')){let[a,b]=s.split('十');return(a?d[a]:1)*10+(b?d[b]:0)}return d[s]??null}function nd(s){return String(s).replace(/一/g,'1').replace(/二/g,'2').replace(/三/g,'3').replace(/四/g,'4').replace(/五/g,'5').replace(/六/g,'6').replace(/七/g,'7').replace(/八/g,'8').replace(/九/g,'9')}function deduct(raw){let m=String(raw||'').match(/扣([0-9一二三四五六七八九十兩]+)秒?/);return m?(cn(m[1].replace(/兩/g,'二'))||0):0}function time(raw){if(!raw)return null;let t=String(raw).replace(/\s+/g,'').replace(/兩/g,'二').replace(/扣.*$/,'');let m=t.match(/^(\d+)[:：](\d{1,2})$/);if(m)return tobj(+m[1],+m[2]);m=t.match(/^([0-9一二三四五六七八九十]+)分([0-9一二三四五六七八九十]+)秒?$/);if(m)return tobj(cn(m[1]),cn(m[2]));m=t.match(/^([0-9一二三四五六七八九十]+)分$/);if(m)return tobj(cn(m[1]),0);m=t.match(/^([0-9一二三四五六七八九十]+)秒$/);if(m)return tobj(0,cn(m[1]));let n=nd(t);if(/^\d{1,4}$/.test(n)){let p=n.padStart(3,'0');return tobj(+p.slice(0,-2),+p.slice(-2))}return null}function tobj(m,s){if(!Number.isFinite(m)||!Number.isFinite(s)||s<0||s>59)return null;return{total:m*60+s,label:`${m}:${String(s).padStart(2,'0')}`}}function action(a){return a==='出發'?'出發':'回來'}function split(text){const ns=roster(),out=[];for(const part of norm(text).replace(/請整理|整理/g,',').split(',').filter(Boolean)){const matches=[],ams=[...part.matchAll(/([0-9一二三四五六七八九十:：分秒]+(?:扣[0-9一二三四五六七八九十兩]+秒?)?)(出發|回來|到達|抵達|回到)?/g)];for(const am of ams){if(!am[2]&&!am[1].includes('扣'))continue;const before=part.slice(0,am.index),name=ns.find(n=>before.endsWith(n));if(name)matches.push([`${name}${am[0]}`,name,am[1],am[2]||'回來'])}if(!matches.length)matches.push(...part.matchAll(/([\u4e00-\u9fff]{2,4})([0-9一二三四五六七八九十:：分秒]+(?:扣[0-9一二三四五六七八九十兩]+秒?)?)(出發|回來|到達|抵達|回到)?/g));if(matches.length){for(const m of matches){const fb=String(m[2]).includes('扣')?'回來':'';out.push({raw:m[0],name:m[1],timeRaw:m[2],action:action(m[3]||fb)})}}else out.push({raw:part,error:'無法拆成「姓名 + 時間 + 出發/回來」'})}return out}function parse(){state.entries=[];state.issues=[];for(const c of split($('cmd').value)){if(c.error){state.issues.push(c);continue}const tm=time(c.timeRaw);if(!tm){state.issues.push({raw:c.raw,error:'時間無法判讀：'+c.timeRaw});continue}state.entries.push({id:Date.now()+Math.random(),name:c.name,action:c.action,time:tm,deduct:deduct(c.timeRaw),raw:c.raw})}render();setStatus(`已整理 ${state.entries.length} 筆紀錄${state.issues.length?'，有 '+state.issues.length+' 筆需確認':''}`,state.issues.length?'bad':'ok')}function idx(e){return state.entries.filter(x=>x.name===e.name&&x.action===e.action).findIndex(x=>x.id===e.id)+1}function groups(){return[...new Set(state.entries.map(e=>e.name))].map(name=>{let trips=Array.from({length:maxTrips},()=>({start:null,back:null}));for(const e of state.entries.filter(x=>x.name===name)){let i=idx(e)-1;if(i>=0&&i<maxTrips)trips[i][e.action==='出發'?'start':'back']=e}return{name,trips}})}function sec(t){if(!t.back)return null;if(!t.start&&!t.back.deduct)return null;return t.start?t.back.time.total-t.start.time.total-t.back.deduct:t.back.time.total-t.back.deduct}function fmt(v){if(v==null||v==='')return'';let sign=v<0?'-':'';v=Math.abs(v);return sign+Math.floor(v/60)+':'+String(v%60).padStart(2,'0')}function ranks(rows){return Array.from({length:maxTrips},(_,i)=>{let arr=rows.map(r=>{let s=sec(r.trips[i]);return s!=null&&s>=0?{name:r.name,s}:null}).filter(Boolean).sort((a,b)=>a.s-b.s),mp=new Map(),rank=0,prev=null;arr.forEach((x,j)=>{if(x.s!==prev)rank=j+1;prev=x.s;mp.set(x.name,rank)});return mp})}function metrics(trips){let done=trips.map((t,i)=>{let s=sec(t);return s!=null&&s>=0?{i,s}:null}).filter(Boolean);if(!done.length)return{pb:'',latest:'',imp:'',bt:''};let pb=done.reduce((b,x)=>x.s<b.s?x:b,done[0]);return{pb:pb.s,latest:done.at(-1).s,imp:done[0].s-done.at(-1).s,bt:'第'+(pb.i+1)+'趟'}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function detail(name,i,st,bk,res,rank){$('mt').textContent=name+' 第'+i+'趟';$('mc').innerHTML=`<div class=line><span>出發時間</span><strong>${esc(st||'未記錄')}</strong></div><div class=line><span>回來時間</span><strong>${esc(bk||'未記錄')}</strong></div><div class=line><span>本趟成績</span><strong>${esc(res||'未完成')}</strong></div><div class=line><span>本趟排名</span><strong>${esc(rank||'-')}</strong></div>`;$('mbg').classList.add('show')}function render(){const rows=groups(),rs=ranks(rows);$('summary').innerHTML='<thead><tr><th>姓名</th>'+Array.from({length:maxTrips},(_,i)=>`<th>第${i+1}趟成績</th>`).join('')+'<th>完成</th><th>PB</th><th>PB趟次</th><th>最新</th><th>進步</th><th>平均</th></tr></thead><tbody>'+(rows.length?rows.map(r=>{let vals=r.trips.map(sec),valid=vals.filter(v=>v!=null&&v>=0),m=metrics(r.trips),avg=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):'';return'<tr><td><b>'+esc(r.name)+'</b></td>'+r.trips.map((t,i)=>{let v=vals[i],bad=v!=null&&v<0,rank=v!=null&&v>=0?rs[i].get(r.name):'',lab=bad?'回來早於出發':fmt(v),bk=t.back?`${t.back.time.label}${t.back.deduct?' 扣'+t.back.deduct+'秒':''}`:'',args=[r.name,i+1,t.start?t.start.time.label:'',bk,lab,rank?'#'+rank:''].map(JSON.stringify).join(',');return`<td class="${bad?'issue':'res'}">${lab?`<button class=link onclick='detail(${args})'>${lab}${rank?'<span class=rank>#'+rank+'</span>':''}</button>`:''}</td>`}).join('')+`<td>${valid.length}</td><td class=res>${fmt(m.pb)}</td><td>${m.bt}</td><td>${fmt(m.latest)}</td><td>${m.imp===''?'':(m.imp>0?'+':'')+m.imp+'秒'}</td><td>${fmt(avg)}</td></tr>`}).join(''):'<tr><td colspan=13>尚未整理</td></tr>')+'</tbody>';$('raw').innerHTML='<thead><tr><th>#</th><th>姓名</th><th>動作</th><th>時間</th><th>第幾次</th><th>原始文字</th></tr></thead><tbody>'+(state.entries.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.name)}</td><td><span class=pill>${e.action}</span></td><td>${e.time.label}${e.deduct?' 扣'+e.deduct+'秒':''}</td><td>${idx(e)}</td><td>${esc(e.raw)}</td></tr>`).join('')+state.issues.map(x=>`<tr><td>?</td><td colspan=4 class=issue>${esc(x.error)}</td><td>${esc(x.raw)}</td></tr>`).join('')||'<tr><td colspan=6>尚無紀錄</td></tr>')+'</tbody>'}function csv(){let headers=['姓名'];for(let i=1;i<=maxTrips;i++)headers.push(`第${i}趟出發`,`第${i}趟回來`,`第${i}趟成績`);headers.push('完成趟數','PB','PB趟次','最新','進步秒數','平均');let rows=[headers];for(const r of groups()){let vals=r.trips.map(sec),valid=vals.filter(v=>v!=null&&v>=0),m=metrics(r.trips),row=[r.name];r.trips.forEach((t,i)=>row.push(t.start?.time.label||'',t.back?`${t.back.time.label}${t.back.deduct?' 扣'+t.back.deduct+'秒':''}`:'',fmt(vals[i])));row.push(valid.length,fmt(m.pb),m.bt,fmt(m.latest),m.imp,fmt(valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):''));rows.push(row)}return rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n')}$('parse').onclick=parse;$('clear').onclick=()=>{$('cmd').value=''};$('reset').onclick=()=>{state.entries=[];state.issues=[];render()};$('demo').onclick=()=>{$('cmd').value='盧昱妡000出發盧冠羽005出發趙祤絜010出發，盧昱妡235回來盧冠羽125回來趙祤絜145回來';parse()};$('copy').onclick=async()=>{await navigator.clipboard.writeText(csv());setStatus('已複製','ok')};$('csv').onclick=()=>{let b=new Blob(['\uFEFF'+csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='游泳整理.csv';a.click()};$('mclose').onclick=()=>$('mbg').classList.remove('show');$('mbg').onclick=e=>{if(e.target===$('mbg'))$('mbg').classList.remove('show')};render();</script></body></html>
