<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游泳口令整理器</title>
<style>
:root{--bg:#eef6f6;--panel:#fff;--ink:#17343b;--muted:#647780;--line:#d7e4e7;--accent:#176b75;--soft:#dff0f1;--warn:#f2c94c;--bad:#b42318;--good:#137a4f}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{padding:16px 18px;background:var(--accent);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:24px}header span{font-size:14px;opacity:.9}main{padding:14px;display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:14px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.title{padding:11px 13px;background:#f7fbfb;border-bottom:1px solid var(--line);font-weight:800}.body{padding:13px}label{display:block;font-weight:800;margin:0 0 8px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:220px;line-height:1.65;resize:vertical}.small{font-size:13px;color:var(--muted);line-height:1.55;margin:8px 0 0}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.grid4{display:grid;grid-template-columns:1.1fr .75fr .75fr .9fr;gap:8px;margin-top:10px}button{border:0;border-radius:7px;padding:11px 12px;font:inherit;font-weight:800;color:#fff;background:var(--accent);cursor:pointer}button.secondary{color:var(--ink);background:#e6eef0}button.warning{color:#352700;background:var(--warn)}button.danger{background:var(--bad)}button:disabled{opacity:.55}.status{margin-top:10px;border-radius:7px;padding:10px 11px;background:#eef6f6;color:var(--muted);line-height:1.5;min-height:42px}.status.good{color:var(--good);background:#e8f6ef}.status.bad{color:var(--bad);background:#fff0ee}.examples{background:#fbf7e6;border:1px solid #eadc9b;border-radius:7px;padding:10px 11px;line-height:1.65;font-size:13px;color:#4b3a08;margin-top:10px}.table-wrap{overflow:auto;max-height:calc(100vh - 110px)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}th{position:sticky;top:0;z-index:1;background:var(--soft);font-weight:800}td.result{font-weight:900;color:var(--accent)}.issue{color:var(--bad);font-weight:900}.rank{display:inline-block;margin-left:5px;border-radius:999px;padding:1px 6px;font-size:12px;font-weight:900;color:#3b2a00;background:var(--warn)}.goodnum{color:var(--good);font-weight:900}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-weight:800;background:var(--soft);color:var(--accent)}.raw{max-height:260px}.result-btn{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:900;padding:0;min-height:0;text-decoration:underline;text-underline-offset:3px}.dialog-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(12,25,31,.45)}.dialog-backdrop.show{display:flex}.dialog{width:min(420px,100%);border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}.dialog h2{margin:0;padding:13px 15px;background:var(--accent);color:#fff;font-size:18px}.dialog-content{padding:15px;line-height:1.8}.dialog-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}.dialog-row strong{font-size:18px;color:var(--accent)}@media(max-width:980px){body{background:#fff}header{position:sticky;top:0;z-index:5;padding:12px 14px}h1{font-size:20px}header span{font-size:12px}main{grid-template-columns:1fr;gap:10px;padding:10px}section{border-radius:0;border-left:0;border-right:0}.body{padding:12px}textarea{min-height:34dvh;font-size:17px}.row{position:sticky;bottom:0;z-index:4;background:rgba(255,255,255,.96);padding:8px 0 0}button{min-height:46px}.table-wrap{max-height:70dvh}th,td{padding:9px 8px;font-size:13px}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>游泳口令整理器</h1><span>點成績看出發/回來明細</span></header>
<main>
<div>
<section><div class="title">一直說，最後整理</div><div class="body"><label for="commandBox">口令文字</label><textarea id="commandBox" placeholder="例：林育成零零零出發方瑞傑零零五出發盧冠宇零一零出發朱信義零一五出發，林育成130回來方瑞傑150回來，請整理"></textarea><div class="row"><button id="listenBtn">開始語音</button><button id="stopBtn" class="secondary" disabled>停止</button><button id="parseBtn" class="warning">整理</button><button id="clearTextBtn" class="secondary">清空文字</button><button id="fullscreenBtn">全螢幕</button><button id="focusInputBtn" class="secondary">繼續輸入</button></div><div id="status" class="status">整理表只顯示每趟成績；點成績可看出發時間、回來時間、排名。</div><div class="examples">時間碼：零零五 = 0:05，零一零 = 0:10，110 = 1:10，1230 = 12:30。</div></div></section>
<section style="margin-top:14px"><div class="title">常用學生名單</div><div class="body"><label for="rosterBox">每行一位學生，可自行新增</label><textarea id="rosterBox" style="min-height:190px">林育丞
方芮婕
盧冠羽
黃敬芫
朱信毅
黃柏豪
朱畇嬨
黃敬倫
陳唯恩
趙祤絜
魏劭倫
魏彤恩
陳曉寬
盧昱妡
陳奕飛
方玥棠</textarea><p class="small">整理時會優先從這份名單抓姓名。臨時學生直接加在最後一行即可。</p></div></section>
<section style="margin-top:14px"><div class="title">學生名單校正</div><div class="body"><label for="correctionBox">每行一組：聽錯=正確</label><textarea id="correctionBox" style="min-height:165px">育成=育丞
育承=育丞
玉成=育丞
育辰=育丞
方芮傑=方芮婕
方瑞傑=方芮婕
方瑞婕=方芮婕
冠宇=冠羽
冠瑜=冠羽
敬元=敬芫
敬原=敬芫
信義=信毅
柏皓=柏豪
芸慈=畇嬨
云慈=畇嬨
祐潔=祤絜
祐絜=祤絜
劭綸=劭倫
昱欣=昱妡
奕霏=奕飛
月棠=玥棠</textarea><p class="small">例：語音把「方芮婕」聽成「方瑞傑」，就填 `方瑞傑=方芮婕`。</p></div></section>
<section style="margin-top:14px"><div class="title">手動補一筆</div><div class="body"><div class="grid4"><input id="manualName" placeholder="姓名"><input id="manualTime" placeholder="時間碼"><select id="manualAction"><option>出發</option><option>回來</option></select><button id="manualAddBtn">加入</button></div><p class="small">手動補記可填 005、零五零、110、1:10、1分10秒。</p></div></section>
<section style="margin-top:14px"><div class="title">資料操作</div><div class="body"><div class="row"><button id="exportBtn">匯出 CSV</button><button id="copyBtn" class="secondary">複製表格</button><button id="resetBtn" class="danger">清空結果</button><button id="demoBtn" class="secondary">放入範例</button></div></div></section>
</div>
<section><div class="title">整理表</div><div class="table-wrap"><table id="summaryTable"></table></div></section>
<section style="grid-column:1/-1"><div class="title">原始紀錄與提醒</div><div class="table-wrap raw"><table id="rawTable"></table></div></section>
</main>
<div class="dialog-backdrop" id="detailDialog"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><h2 id="detailTitle">趟次明細</h2><div class="dialog-content" id="detailContent"></div><div class="body"><button id="closeDetailBtn" class="secondary" style="width:100%">關閉</button></div></div></div>
<script>
const maxTrips=6,state={entries:[],issues:[]};let recognition=null,listening=false;const el=id=>document.getElementById(id);
function setStatus(m,t=""){const b=el("status");b.textContent=m;b.className=`status ${t}`.trim()}
function corrections(){return (el("correctionBox")?.value||"").split(/\n+/).map(x=>x.trim()).filter(x=>x&&x.includes("=")).map(line=>{const [wrong,right]=line.split("=").map(p=>p.trim()).filter(Boolean);return wrong&&right?{wrong,right}:null}).filter(Boolean)}
function applyCorrections(text){let out=text;for(const{wrong,right}of corrections())out=out.replaceAll(wrong,right);return out}
function rosterNames(){return (el("rosterBox")?.value||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).sort((a,b)=>b.length-a.length)}
function normalizeText(text){return applyCorrections(text).replace(/[，、。；;｜|]/g,",").replace(/\s+/g,"").replace(/兩/g,"二").replace(/[零〇]/g,"0")}
function cnNum(raw){if(raw===undefined||raw===null||raw==="")return 0;const s=String(raw).replace(/[零〇]/g,"");if(/^\d+$/.test(s))return Number(s);const d={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};if(s==="十")return 10;if(s.includes("十")){const[t,o]=s.split("十");return (t?d[t]:1)*10+(o?d[o]:0)}return d[s]??null}
function normalizeDigits(raw){return String(raw).replace(/一/g,"1").replace(/二/g,"2").replace(/三/g,"3").replace(/四/g,"4").replace(/五/g,"5").replace(/六/g,"6").replace(/七/g,"7").replace(/八/g,"8").replace(/九/g,"9")}
function parseTime(raw){if(!raw)return null;let text=String(raw).trim().replace(/\s+/g,"").replace(/兩/g,"二");const colon=text.match(/^(\d+)[:：](\d{1,2})$/);if(colon)return timeObj(Number(colon[1]),Number(colon[2]));const minSec=text.match(/^([0-9一二三四五六七八九十]+)分([0-9一二三四五六七八九十]+)秒?$/);if(minSec)return timeObj(cnNum(minSec[1]),cnNum(minSec[2]));const minOnly=text.match(/^([0-9一二三四五六七八九十]+)分$/);if(minOnly)return timeObj(cnNum(minOnly[1]),0);const secOnly=text.match(/^([0-9一二三四五六七八九十]+)秒$/);if(secOnly)return timeObj(0,cnNum(secOnly[1]));const numericText=normalizeDigits(text);if(/^\d{1,4}$/.test(numericText)){const p=numericText.padStart(3,"0"),m=Number(p.slice(0,-2)),s=Number(p.slice(-2));return timeObj(m,s)}return null}
function timeObj(minute,second){if(!Number.isFinite(minute)||!Number.isFinite(second)||second<0||second>59)return null;const total=minute*60+second;return{minute,second,total,label:`${minute}:${String(second).padStart(2,"0")}`}}
function normalizeAction(a){return a==="出發"?"出發":"回來"}
function splitCommands(text){const normalized=normalizeText(text).replace(/請整理|整理/g,",");const commands=[],names=rosterNames();for(const part of normalized.split(",").filter(Boolean)){const matches=[],ams=[...part.matchAll(/([0-9一二三四五六七八九十:：分秒]+)(出發|回來|到達|抵達|回到)/g)];for(const am of ams){const before=part.slice(0,am.index),name=names.find(n=>before.endsWith(n));if(name)matches.push([`${name}${am[0]}`,name,am[1],am[2]])}if(!matches.length)matches.push(...part.matchAll(/([\u4e00-\u9fff]{2,4})([0-9一二三四五六七八九十:：分秒]+)(出發|回來|到達|抵達|回到)/g));if(matches.length){for(const m of matches)commands.push({raw:m[0],name:m[1],timeRaw:m[2],action:normalizeAction(m[3])})}else commands.push({raw:part,error:"無法拆成「姓名 + 時間 + 出發/回來」"})}return commands}
function parseAll(){state.entries=[];state.issues=[];for(const c of splitCommands(el("commandBox").value)){if(c.error){state.issues.push({raw:c.raw,issue:c.error});continue}const t=parseTime(c.timeRaw);if(!t){state.issues.push({raw:c.raw,issue:`時間無法判讀：${c.timeRaw}`});continue}addEntry(c.name,c.action,t,c.raw,false)}render();setStatus(`已整理 ${state.entries.length} 筆紀錄${state.issues.length?`，有 ${state.issues.length} 筆需要確認`:""}。`,state.issues.length?"bad":"good")}
function addEntry(name,action,time,raw,draw=true){state.entries.push({id:`${Date.now()}-${Math.random()}`,name,action,time,raw:raw||`${name}${time.label}${action}`});if(draw){render();setStatus(`已加入：${name} ${time.label} ${action}`,"good")}}
function actionIndex(entry){return state.entries.filter(x=>x.name===entry.name&&x.action===entry.action).findIndex(x=>x.id===entry.id)+1}
function grouped(){return[...new Set(state.entries.map(e=>e.name))].map(name=>{const trips=Array.from({length:maxTrips},()=>({start:null,back:null}));for(const e of state.entries.filter(x=>x.name===name)){const i=actionIndex(e)-1;if(i>=0&&i<maxTrips)trips[i][e.action==="出發"?"start":"back"]=e}return{name,trips}})}
function tripRankMaps(rows){return Array.from({length:maxTrips},(_,i)=>{const r=rows.map(({name,trips})=>{const t=trips[i];if(!t.start||!t.back)return null;const seconds=t.back.time.total-t.start.time.total;return seconds>=0?{name,seconds}:null}).filter(Boolean).sort((a,b)=>a.seconds-b.seconds);const map=new Map();let rank=0,prev=null;r.forEach((x,idx)=>{if(x.seconds!==prev)rank=idx+1;prev=x.seconds;map.set(x.name,rank)});return map})}
function swimmerMetrics(trips){const done=trips.map((t,i)=>{if(!t.start||!t.back)return null;const seconds=t.back.time.total-t.start.time.total;return seconds>=0?{index:i,seconds}:null}).filter(Boolean);if(!done.length)return{pb:"",latest:"",improvement:"",bestTrip:""};const pb=done.reduce((b,x)=>x.seconds<b.seconds?x:b,done[0]);const first=done[0].seconds,latest=done[done.length-1].seconds;return{pb:pb.seconds,latest,improvement:first-latest,bestTrip:`第${pb.index+1}趟`}}
function fmt(total){if(total===null||total===undefined||total==="")return"";const sign=total<0?"-":"",abs=Math.abs(total);return`${sign}${Math.floor(abs/60)}:${String(abs%60).padStart(2,"0")}`}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function showTripDetail(name,tripNumber,startLabel,backLabel,resultLabel,rankLabel){el("detailTitle").textContent=`${name} 第${tripNumber}趟`;el("detailContent").innerHTML=`<div class="dialog-row"><span>出發時間</span><strong>${escapeHtml(startLabel||"未記錄")}</strong></div><div class="dialog-row"><span>回來時間</span><strong>${escapeHtml(backLabel||"未記錄")}</strong></div><div class="dialog-row"><span>本趟成績</span><strong>${escapeHtml(resultLabel||"未完成")}</strong></div><div class="dialog-row"><span>本趟排名</span><strong>${escapeHtml(rankLabel||"-")}</strong></div>`;el("detailDialog").classList.add("show")}
function render(){const rows=grouped(),rankMaps=tripRankMaps(rows);el("summaryTable").innerHTML=`<thead><tr><th>姓名</th>${Array.from({length:maxTrips},(_,i)=>`<th>第${i+1}趟成績</th>`).join("")}<th>完成</th><th>PB</th><th>PB趟次</th><th>最新</th><th>進步</th><th>平均</th></tr></thead><tbody>${rows.length?rows.map(({name,trips})=>{const results=trips.map(t=>t.start&&t.back?t.back.time.total-t.start.time.total:null),valid=results.filter(v=>v!==null&&v>=0),m=swimmerMetrics(trips),avg=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):"";return`<tr><td><strong>${escapeHtml(name)}</strong></td>${trips.map((t,i)=>{const r=results[i],bad=r!==null&&r<0,rank=r!==null&&r>=0?rankMaps[i].get(name):"",label=bad?"回來早於出發":fmt(r),args=[name,i+1,t.start?t.start.time.label:"",t.back?t.back.time.label:"",label,rank?`#${rank}`:""].map(JSON.stringify).join(",");return`<td class="${bad?"issue":"result"}">${label?`<button class="result-btn" onclick='showTripDetail(${args})'>${label}${rank?`<span class="rank">#${rank}</span>`:""}</button>`:""}</td>`}).join("")}<td>${valid.length}</td><td class="result">${fmt(m.pb)}</td><td>${m.bestTrip}</td><td>${fmt(m.latest)}</td><td class="${m.improvement>0?"goodnum":"muted"}">${m.improvement===""?"":m.improvement>0?`+${m.improvement}秒`:`${m.improvement}秒`}</td><td>${fmt(avg)}</td></tr>`}).join(""):`<tr><td colspan="13">尚未整理。把口令貼到左邊後按「整理」。</td></tr>`}</tbody>`;const raw=state.entries.map((e,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(e.name)}</td><td><span class="pill">${e.action}</span></td><td>${e.time.label}</td><td>${actionIndex(e)}</td><td>${escapeHtml(e.raw)}</td></tr>`).join(""),issues=state.issues.map(x=>`<tr><td class="issue">?</td><td colspan="4" class="issue">${escapeHtml(x.issue)}</td><td>${escapeHtml(x.raw)}</td></tr>`).join("");el("rawTable").innerHTML=`<thead><tr><th>#</th><th>姓名</th><th>動作</th><th>時間</th><th>第幾次</th><th>原始文字</th></tr></thead><tbody>${raw||issues?raw+issues:`<tr><td colspan="6">尚無紀錄。</td></tr>`}</tbody>`}
function setupSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const rec=new SR();rec.lang="zh-TW";rec.continuous=true;rec.interimResults=false;rec.onresult=e=>{let added="";for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)added+=e.results[i][0].transcript+"，";if(added){el("commandBox").value+=added;if(/請整理|整理/.test(added))parseAll();else setStatus(`已加入語音文字：${added}`,"good")}};rec.onerror=e=>setStatus(`語音錯誤：${e.error}。也可以直接用鍵盤語音輸入到文字框。`,"bad");rec.onend=()=>{if(listening)try{rec.start()}catch{}};return rec}
el("listenBtn").onclick=()=>{recognition||=setupSpeech();if(!recognition){setStatus("這個瀏覽器不支援內建語音辨識。請直接點文字框，用手機或電腦鍵盤的語音輸入。","bad");return}listening=true;try{recognition.start()}catch{}el("listenBtn").disabled=true;el("stopBtn").disabled=false;setStatus("正在聽。你可以一直講，最後講「請整理」或按整理。","good")};
el("stopBtn").onclick=()=>{listening=false;try{recognition?.stop()}catch{}el("listenBtn").disabled=false;el("stopBtn").disabled=true;setStatus("已停止語音。")};
el("parseBtn").onclick=parseAll;el("clearTextBtn").onclick=()=>{el("commandBox").value="";setStatus("已清空文字。")};
el("closeDetailBtn").onclick=()=>el("detailDialog").classList.remove("show");el("detailDialog").onclick=e=>{if(e.target===el("detailDialog"))el("detailDialog").classList.remove("show")};
el("fullscreenBtn").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();setStatus("已切換全螢幕模式。","good")}catch{setStatus("這個瀏覽器不允許全螢幕，仍可正常使用。","bad")}};
el("focusInputBtn").onclick=()=>{el("commandBox").focus();setStatus("游標已回到口令文字框，可以繼續語音輸入。","good")};
el("manualAddBtn").onclick=()=>{const name=el("manualName").value.trim(),time=parseTime(el("manualTime").value.trim()),action=el("manualAction").value;if(!name||!time){setStatus("手動補記失敗：請確認姓名和時間碼。","bad");return}addEntry(name,action,time,"手動補記")};
el("resetBtn").onclick=()=>{if(!confirm("確定清空整理結果？左邊口令文字會保留。"))return;state.entries=[];state.issues=[];render();setStatus("已清空整理結果。")};
el("demoBtn").onclick=()=>{el("commandBox").value="林育成零零零出發方瑞傑零零五出發盧冠宇零一零出發朱信義零一五出發，林育成130回來方瑞傑150回來盧冠宇200回來朱信義215回來，林玉成130出發林玉成300回來方瑞傑零零一出發方瑞傑零五零回來，請整理";parseAll()};
function summaryText(){return grouped().map(({name,trips})=>`${name}\t${trips.map((t,i)=>{const r=t.start&&t.back?t.back.time.total-t.start.time.total:null;return`第${i+1}趟 ${t.start?t.start.time.label:""} / ${t.back?t.back.time.label:""} / ${fmt(r)}`}).join("\t")}`).join("\n")}
function summaryCsv(){const headers=["姓名"];for(let i=1;i<=maxTrips;i++)headers.push(`第${i}趟出發`,`第${i}趟回來`,`第${i}趟成績`);headers.push("完成趟數","PB","PB趟次","最新","進步秒數","平均");const rows=[headers];for(const{name,trips}of grouped()){const row=[name],results=trips.map(t=>t.start&&t.back?t.back.time.total-t.start.time.total:null),valid=results.filter(v=>v!==null&&v>=0),m=swimmerMetrics(trips);trips.forEach((t,i)=>row.push(t.start?.time.label||"",t.back?.time.label||"",fmt(results[i])));row.push(valid.length,fmt(m.pb),m.bestTrip,fmt(m.latest),m.improvement===""?"":m.improvement,fmt(valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):""));rows.push(row)}return rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n")}
el("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(summaryText());setStatus("已複製表格文字。","good")}catch{setStatus("複製失敗，請改用匯出 CSV。","bad")}};
el("exportBtn").onclick=()=>{const blob=new Blob(["\uFEFF"+summaryCsv()],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`游泳整理_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)};
render();
</script>
